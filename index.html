<h1>SiteOnWeb — hébergement des médias</h1>
<p>Ce dépôt sert uniquement à héberger les visuels publiés sur Instagram.
L'API Meta ne reçoit aucun fichier : elle va le chercher à une URL publique.</p>
<p>Rien d'autre n'y transite. <a href="https://www.siteonweb.fr/">siteonweb.fr</a></p>
